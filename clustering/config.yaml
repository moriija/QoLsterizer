# ============================================================================
# Everything the pipeline does is controlled from this file.
# Range syntax used in `search_space`:
#   [lo, hi]            two ints -> integer range | two floats -> float range
#   [a, b, c]           anything else -> categorical choice (Optuna picks one)
#   {choices: [1, 2]}  explicit categorical (use for 2 numbers you want as choices)
#   value               a plain scalar -> fixed (not tuned)
# ============================================================================

data:
  path: data/processed/sel4_full.csv   # output of preprocessing/preprocess.py (or data/processed/features.csv after prepare_data.py)
  sep: ";"
  # Expected FORMAT: long table, one row per (id_col, year_col); every other column is a feature.
  # Features are auto-detected, so adding/removing columns needs no code change.
  year_col: "Período"
  id_col: "Distrito"
  include_cols: null          # null = all feature columns; or a list of column names to keep
  exclude_cols: []            # columns to ignore (e.g. raw counts, population size)
  # The data must arrive complete (no NaN): imputation is done upstream. If NaNs are found the run
  # stops with an error listing the affected columns; nothing is imputed or dropped for you.

years: [2023]                 # list of years, or "all"
multi_year:
  strategy: per_year          # per_year | reference (search on reference_year, predict the others)
  reference_year: 2023

# ---- what to run -----------------------------------------------------------
clusterers: [kmeans]                   # available: kmeans, gmm, agglomerative, hdbscan
reducers: [pca, corr_pca, corr_only]   # available: none, pca, corr_pca, corr_only (Optuna picks one per trial)

# ---- Optuna ----------------------------------------------------------------
optuna:
  n_trials: 60                         # per clusterer
  seed: 42

search_space:
  scaler: [standard, robust, power]    # power = Yeo-Johnson (helps skewed rate/count features)

  # clusterers
  kmeans:
    k: [2, 10]
    n_init: 20
    init: k-means++
  gmm:
    k: [2, 10]
    covariance_type: [spherical, diag, tied]
  agglomerative:
    k: [2, 10]
    linkage: [ward, average, complete]
  hdbscan:
    min_cluster_size: [4, 20]
    min_samples: [1, 8]

  # reducers (components are auto-capped to the number of features / rows)
  pca:
    n_components: [2, 12]
  corr_pca:
    corr_thr: [0.7, 0.95]
    n_components: [2, 10]
  corr_only:
    corr_thr: [0.6, 0.95]

# ---- evaluation ------------------------------------------------------------
evaluation:
  n_bootstrap: 15              # subsample refits used for the stability score
  subsample_frac: 0.8
  weights: {silhouette: 0.4, davies_bouldin: 0.3, stability: 0.3}
  constraints:                 # hard: a trial violating any of these is infeasible
    min_cluster_size: 4
    max_cluster_share: 0.60
    max_noise_fraction: 0.15
    min_stability: 0.50
    min_clusters: 2
    max_clusters: 10

# ---- registration ----------------------------------------------------------
registry:
  model_name: sp_district_clusters
  alias: champion
  gate:                        # minimum thresholds to be registered
    min_silhouette: 0.20
    min_stability: 0.60
  min_improvement: 0.0         # new objective must beat the champion by at least this

mlflow:
  tracking_uri: ./mlruns
  experiment: clustering_districts
